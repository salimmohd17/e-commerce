<div class="modal-overlay" id="product-modal-overlay" hidden></div>
<div class="product-modal" id="product-modal" role="dialog" aria-modal="true" aria-label="Product details" hidden>
  <button class="modal-close" id="modal-close" type="button" aria-label="Close"><i class='bx bx-x'></i></button>
  <div class="modal-inner">
    <div class="modal-visual" id="modal-visual"></div>
    <div class="modal-info">
      <p class="modal-category" id="modal-category"></p>
      <h2 class="modal-title" id="modal-title"></h2>
      <div class="modal-rating">
        <span class="stars">★★★★★</span>
        <span class="modal-reviews" id="modal-reviews"></span>
      </div>
      <p class="modal-description" id="modal-description"></p>
      <div class="modal-price-row">
        <span class="modal-price" id="modal-price"></span>
        <span class="modal-tag" id="modal-tag"></span>
      </div>

      <div class="modal-field">
        <label><i class='bx bx-store'></i> Available at Store</label>
        <p class="modal-store" id="modal-store"></p>
      </div>
      <div class="modal-field" id="modal-colors-wrap">
        <label>Choose Color</label>
        <div class="color-swatches" id="modal-colors"></div>
      </div>
      <div class="modal-field">
        <label>Quantity</label>
        <div class="quantity-controls modal-qty">
          <button type="button" id="modal-qty-minus" aria-label="Decrease">−</button>
          <span id="modal-qty-value">1</span>
          <button type="button" id="modal-qty-plus" aria-label="Increase">+</button>
        </div>
        <span class="modal-stock" id="modal-stock"></span>
      </div>
      <div class="modal-actions">
        <button class="primary-button modal-add-btn" id="modal-add-to-cart" type="button"><i class='bx bx-cart-add'></i> Add to Cart</button>
        <button class="modal-wish-btn" id="modal-wishlist-btn" type="button" aria-label="Add to wishlist"><i class='bx bx-heart'></i></button>
      </div>
    </div>
  </div>
</div>
