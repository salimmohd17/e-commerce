<div class="auth-overlay" id="auth-overlay" hidden></div>
<div class="auth-modal" id="auth-modal" role="dialog" aria-modal="true" aria-label="Sign in" hidden>
  <button class="modal-close" id="auth-close" type="button" aria-label="Close"><i class='bx bx-x'></i></button>

  <div class="auth-section" id="auth-login">
    <div class="auth-logo">
      <span class="logo-mark" style="width:48px;height:48px;border-radius:16px;font-size:1.5rem">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" stroke="#1b4936" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="3" y1="6" x2="21" y2="6" stroke="#1b4936" stroke-width="2" stroke-linecap="round"/><path d="M16 10a4 4 0 01-8 0" stroke="#1b4936" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </div>
    <h2>Welcome back</h2>
    <p class="auth-sub">Sign in to your CoastCart account</p>

    <form class="auth-form" id="login-form">
      <label>Email or Phone
        <input type="text" placeholder="you@example.com or 0712..." id="login-identifier" required>
      </label>
      <label>Password
        <div class="pass-wrap">
          <input type="password" placeholder="••••••••" id="login-password" required>
          <button type="button" class="pass-toggle" aria-label="Show password"><i class='bx bx-show'></i></button>
        </div>
      </label>
      <a href="#" class="forgot-link">Forgot password?</a>
      <button type="submit" class="primary-button full-btn">Sign In</button>
    </form>

    <div class="auth-divider"><span>or continue with</span></div>

    <div class="social-auth">
      <button class="social-btn google" type="button"><i class='bx bxl-google'></i> Google</button>
      <button class="social-btn facebook" type="button"><i class='bx bxl-facebook'></i> Facebook</button>
      <button class="social-btn insta" type="button"><i class='bx bxl-instagram'></i> Instagram</button>
      <button class="social-btn twitter" type="button"><i class='bx bxl-twitter'></i> X (Twitter)</button>
    </div>

    <p class="auth-switch">No account? <button type="button" class="auth-switch-btn" id="go-register">Create one</button></p>
  </div>

  <div class="auth-section hidden" id="auth-register">
    <h2>Create Account</h2>
    <p class="auth-sub">Join CoastCart — it's free</p>

    <form class="auth-form" id="register-form">
      <div class="form-row">
        <label>First Name<input type="text" placeholder="John" required></label>
        <label>Last Name<input type="text" placeholder="Mwangi" required></label>
      </div>
      <label>Email Address<input type="email" placeholder="you@example.com" required></label>
      <label>Phone Number<input type="tel" placeholder="+254 7XX XXX XXX" required></label>
      <label>Country
        <select required>
          <option value="">Select country</option>
          <option value="KE" selected>Kenya</option>
          <option value="TZ">Tanzania</option>
          <option value="UG">Uganda</option>
          <option value="RW">Rwanda</option>
          <option value="ET">Ethiopia</option>
          <option value="NG">Nigeria</option>
          <option value="GH">Ghana</option>
          <option value="ZA">South Africa</option>
          <option value="GB">United Kingdom</option>
          <option value="US">United States</option>
        </select>
      </label>
      <label>Region / County<input type="text" placeholder="Mombasa County" required></label>
      <label>Password
        <div class="pass-wrap">
          <input type="password" placeholder="Create a strong password" required>
          <button type="button" class="pass-toggle" aria-label="Show password"><i class='bx bx-show'></i></button>
        </div>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" required>
        I agree to the <a href="#">Terms &amp; Conditions</a>
      </label>
      <button type="submit" class="primary-button full-btn">Create Account</button>
    </form>

    <p class="auth-switch">Already have an account? <button type="button" class="auth-switch-btn" id="go-login">Sign In</button></p>
  </div>
</div>
