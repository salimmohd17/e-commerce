<div class="overlay" id="overlay" hidden></div>

<aside class="cart-panel" id="cart-panel" aria-label="Shopping cart" aria-hidden="true">
  <div class="cart-heading">
    <div><p class="eyebrow">YOUR SELECTION</p><h2>Your cart</h2></div>
    <button id="cart-close" class="icon-button" type="button" aria-label="Close cart"><i class='bx bx-x'></i></button>
  </div>
  <div id="cart-items" class="cart-items"></div>
  <div class="cart-bottom">
    <div class="cart-total"><span>Subtotal</span><strong id="cart-subtotal">KSh 0</strong></div>
    <button id="checkout-button" class="primary-button checkout-button" type="button">
      <i class='bx bx-lock-alt'></i> Continue to checkout
    </button>
    <button id="clear-cart" class="clear-cart" type="button">Clear cart</button>
  </div>
</aside>
